name: Build Image and Run Tests

on:
  push:
    branches:
      - '**'
      - '!humble'
      - '!jazzy'

jobs:
  Build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and use GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ghcr.io/helbling-technik/helmoro-software-ros2:${{ github.ref_name }}-latest
          load: true
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/helbling-technik/helmoro-software-ros2:${{ github.ref_name }}-buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/helbling-technik/helmoro-software-ros2:${{ github.ref_name }}-buildcache,mode=max
        
      - name: Start container
        shell: bash
        run: docker run --name test_container -v /tmp/.X11-unix:/tmp/.X11-unix -v /var/run/docker.sock:/var/run/docker.sock --detach ghcr.io/helbling-technik/helmoro-software-ros2:${{ github.ref_name }}-latest tail -f /dev/null

      - name: Run test
        shell: bash
        run: |
          set -e

          echo "Starting virtual display (Xvfb)..."
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          export ROS_DOMAIN_ID=42
          
          echo "Start testing..."
          docker exec -e DISPLAY=$DISPLAY test_container bash -c "
            source ./entrypoint.sh &&
            colcon test &&
            colcon test-result --verbose
          "
      
      - name: Export logs to runner
        shell: bash
        run: docker cp test_container:/home/ws/log ./log
        if: always() # export logs even if tests fail

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: ./log
          if-no-files-found: error
        if: always() # upload logs even if tests fail