name: docker build & colcon-test

on:
  push:
    branches:
      - microservices
  pull_request:
    branches:
      - microservices

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and use GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ghcr.io/helbling-technik/github_actions:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  colcon-test:
    needs: docker-build
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/helbling-technik/github_actions:latest
    steps:
      - uses: ros-tooling/action-ros-ci@v0.4
        id: action_ros_ci_step    
        with:
          package-name: helmoro_description
          target-ros2-distro: jazzy
          coverage-result: false

      - uses: actions/upload-artifact@v4
        with:
            name: colcon-logs
            path: ${{ steps.action_ros_ci_step.outputs.ros-workspace-directory-name }}/log
        if: always() # upload the logs even when the build fails
