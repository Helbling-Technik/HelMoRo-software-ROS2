name: docker build & colcon-test

on:
  push:
    branches:
      - '**'
      - '!humble'
      - '!jazzy'

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and use GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ghcr.io/helbling-technik/github_actions:latest
          push: true
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/helbling-technik/github_actions:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/helbling-technik/github_actions:buildcache,mode=max


  colcon-test:
    needs: docker-build
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/helbling-technik/github_actions:latest
    steps:
      - name: colcon test
        run: |
          colcon test

      - uses: actions/upload-artifact@v4
        with:
            name: colcon-logs
            path: /home/ws/log
            if-no-files-found: error
        if: always() # upload the logs even when the build fails
