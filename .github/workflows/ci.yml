name: Build Docker Image and Run colcon Test

on:
  push:
    branches:
      - microservices
  pull_request:
    branches:
      - microservices

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and use GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ghcr.io/helbling-technik/github_actions:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      - name: Run colcon test
        run: |
          docker run ghcr.io/helbling-technik/github_actions:latest \
            bash -c "colcon test"